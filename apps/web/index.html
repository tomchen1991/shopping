<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="记录电子产品、游戏与手办的购买进度。" />
    <title>订购小屋</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">个人订购管理</p>
      <h1>订购小屋</h1>
      <p class="intro">记录电子产品、游戏与手办，把到手的收藏布置进可分享的小屋。</p>
      <section aria-labelledby="manage-title">
        <h2 id="manage-title">订购管理</h2>
        <p id="manage-status" role="status" aria-atomic="true">正在检查管理会话…</p>
        <button type="button" id="reload-management" hidden>重新加载管理数据</button>
        <fieldset id="management" hidden>
          <legend class="sr-only">私有管理</legend>
          <section aria-labelledby="create-title">
            <h3 id="create-title">添加感兴趣的商品</h3>
            <form id="create-product" class="fields">
              <label>商品名称<input name="name" maxlength="200" required></label>
              <label>分类<select name="category">
                <option value="electronics">电子产品</option>
                <option value="game">游戏</option>
                <option value="figure">手办</option>
              </select></label>
              <div id="category-fields" class="fields wide" role="group" aria-label="分类信息"></div>
              <label>商品链接<input name="link" type="url" maxlength="2048"></label>
              <label>目标价（CNY）<input name="targetPriceCents" inputmode="decimal"></label>
              <label>标签（逗号分隔）<input name="tags" maxlength="1530"></label>
              <label>感兴趣的原因<textarea name="interestReason" maxlength="2000"></textarea></label>
              <label class="wide">本地封面（可选，最大 5 MiB）<input name="cover" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
              <div class="wide"><button>添加商品</button></div>
            </form>
          </section>
          <section aria-labelledby="products-title">
            <h3 id="products-title">感兴趣的商品</h3>
            <div id="product-list"></div>
          </section>
          <section id="product-detail" aria-label="商品详情" hidden></section>
          <section aria-labelledby="holdings-title">
            <h3 id="holdings-title">持有物</h3>
            <p id="holdings-count"></p>
            <ul id="holdings-list"></ul>
          </section>
        </fieldset>
      </section>
      <section class="health" aria-labelledby="health-title">
        <h2 id="health-title">服务状态</h2>
        <p id="health-status" role="status" aria-atomic="true">正在检查 API…</p>
        <button type="button" id="check-health">重新检查</button>
        <noscript>请启用 JavaScript 以检查 API 状态。</noscript>
      </section>
    </main>
  </body>
</html>
